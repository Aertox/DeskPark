version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript*', 'prettier', 'vitest', '@types/*']
      react:
        patterns: ['react', 'react-dom', '@vitejs/*', 'vite']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
