version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 运行环境为 Node 22
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint 目前仅支持 TypeScript < 6.1
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dev-tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript*', 'prettier', 'vitest', '@types/*']
      react:
        patterns: ['react', 'react-dom', '@vitejs/*', 'vite']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
